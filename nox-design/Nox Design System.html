<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nox — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg-primary: #0A0A0A;
    --bg-secondary: #111111;
    --bg-elevated: #1A1A1A;
    --text-primary: #F5F5F7;
    --text-secondary: #A1A1A6;
    --text-muted: #6C6C70;
    --accent: #F0A854;
    --accent-success: #30D158;
    --accent-danger: #FF453A;
    --border: #2C2C2E;
    --border-subtle: #1C1C1E;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* NAV */
  .ds-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 40px;
    height: 52px;
  }

  .ds-nav-logo { display: flex; align-items: center; gap: 10px; margin-right: 24px; }
  .ds-nav-logo span { font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }

  .ds-nav a {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-muted);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }
  .ds-nav a:hover { color: var(--text-primary); background: var(--border-subtle); }

  /* SECTIONS */
  .ds-section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 80px 40px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .ds-section:last-child { border-bottom: none; }

  .ds-section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .ds-section-title {
    font-family: 'DM Sans', sans-serif;
    font-weight: 800;
    font-size: 36px;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }
  .ds-section-sub {
    color: var(--text-secondary);
    font-size: 16px;
    margin-bottom: 52px;
    max-width: 560px;
  }

  .ds-row { display: flex; gap: 24px; flex-wrap: wrap; }
  .ds-col { flex: 1; min-width: 200px; }

  /* HERO BANNER */
  .ds-hero {
    padding: 60px 40px 60px;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 60px;
  }
  .ds-hero-text { flex: 1; }
  .ds-hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(240,168,84,0.1);
    border: 1px solid rgba(240,168,84,0.25);
    color: var(--accent);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 5px 12px;
    border-radius: 50px;
    margin-bottom: 24px;
  }
  .ds-hero h1 {
    font-family: 'DM Sans', sans-serif;
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 0.95;
    margin-bottom: 16px;
  }
  .ds-hero h1 .accent { color: var(--accent); }
  .ds-hero p { color: var(--text-secondary); font-size: 18px; font-weight: 300; }

  /* TWEAKS PANEL */
  #tweaks-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    width: 240px;
    z-index: 999;
    display: none;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  }
  #tweaks-panel.visible { display: block; }
  .tweaks-title {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 16px;
    color: var(--text-primary);
  }
  .tweaks-row { margin-bottom: 14px; }
  .tweaks-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; font-weight: 400; }
  .tweaks-row input[type=range] { width: 100%; accent-color: var(--accent); }
  .tweaks-row select {
    width: 100%;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 6px 8px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
  }
  .tweaks-swatch-row { display: flex; gap: 6px; }
  .tweaks-swatch {
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.1s;
  }
  .tweaks-swatch:hover { transform: scale(1.1); }
  .tweaks-swatch.active { border-color: white; }
</style>
</head>
<body>

<!-- NAV -->
<nav class="ds-nav">
  <div class="ds-nav-logo">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
      <circle cx="11" cy="11" r="11" fill="#0A0A0A"/>
      <path d="M14.5 4.2A7.8 7.8 0 1 0 14.5 19.8 7 7 0 0 1 14.5 4.2Z" fill="#F0A854"/>
    </svg>
    <span>nox</span>
  </div>
  <a href="#logos">Logo</a>
  <a href="#tokens">Tokens</a>
  <a href="#type">Tipografia</a>
  <a href="#login">Login</a>
  <a href="#hero">Hero</a>
  <a href="#components">Componentes</a>
</nav>

<div id="app"></div>

<div id="tweaks-panel">
  <div class="tweaks-title">Tweaks</div>
  <div class="tweaks-row">
    <div class="tweaks-label">Accent color</div>
    <div class="tweaks-swatch-row">
      <div class="tweaks-swatch active" style="background:#F0A854" data-color="#F0A854" title="Âmbar"></div>
      <div class="tweaks-swatch" style="background:#E8C97A" data-color="#E8C97A" title="Ouro"></div>
      <div class="tweaks-swatch" style="background:#F07854" data-color="#F07854" title="Cobre"></div>
      <div class="tweaks-swatch" style="background:#B0F054" data-color="#B0F054" title="Lima"></div>
      <div class="tweaks-swatch" style="background:#54C5F0" data-color="#54C5F0" title="Gelo"></div>
    </div>
  </div>
  <div class="tweaks-row">
    <div class="tweaks-label">Logo variant</div>
    <select id="tweak-logo">
      <option value="crescent">Crescent</option>
      <option value="eye">Eye</option>
      <option value="shield">Shield</option>
    </select>
  </div>
  <div class="tweaks-row">
    <div class="tweaks-label">Login layout</div>
    <select id="tweak-login">
      <option value="a">Opção A — Centrado</option>
      <option value="b">Opção B — Bottom sheet</option>
      <option value="c">Opção C — Minimalista</option>
    </select>
  </div>
</div>

<script type="text/babel">

const { useState, useEffect, useRef } = React;

// ─── TOKENS ──────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#F07854",
  "logoVariant": "shield",
  "loginLayout": "c"
}/*EDITMODE-END*/;

// ─── LOGO MARKS ──────────────────────────────────────────────────────────────
function LogoCrescent({ size = 40, color = '#F0A854', bg = '#0A0A0A' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="20" fill={bg}/>
      <path d="M25 7.5A12.5 12.5 0 1 0 25 32.5 11 11 0 0 1 25 7.5Z" fill={color}/>
    </svg>
  );
}

function LogoEye({ size = 40, color = '#F0A854', bg = '#0A0A0A' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="20" fill={bg}/>
      {/* Eye outline */}
      <path d="M6 20C6 20 11 11 20 11C29 11 34 20 34 20C34 20 29 29 20 29C11 29 6 20 6 20Z" stroke={color} strokeWidth="1.5" fill="none"/>
      {/* Moon crescent inside eye */}
      <path d="M23 15.5A4.5 4.5 0 1 0 23 24.5 3.5 3.5 0 0 1 23 15.5Z" fill={color}/>
    </svg>
  );
}

function LogoShield({ size = 40, color = '#F0A854', bg = '#0A0A0A' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 40 40" fill="none">
      <circle cx="20" cy="20" r="20" fill={bg}/>
      <path d="M20 8L30 12V20C30 25.5 25.5 30.5 20 32C14.5 30.5 10 25.5 10 20V12L20 8Z" stroke={color} strokeWidth="1.5" fill="none" strokeLinejoin="round"/>
      <path d="M23.5 14A3.5 3.5 0 1 0 23.5 21.5 2.8 2.8 0 0 1 23.5 14Z" fill={color}/>
    </svg>
  );
}

function AppIcon({ variant = 'crescent', size = 60, accent = '#F0A854', elevated = false }) {
  const r = size * 0.22;
  const Mark = variant === 'eye' ? LogoEye : variant === 'shield' ? LogoShield : LogoCrescent;
  return (
    <div style={{
      width: size, height: size,
      borderRadius: r,
      background: elevated ? '#1C1C1E' : '#0A0A0A',
      border: '1px solid #2C2C2E',
      borderTop: elevated ? '1px solid #3A3A3C' : '1px solid #2C2C2E',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: `0 0 0 1px rgba(0,0,0,0.5), 0 8px 32px rgba(0,0,0,0.5)`,
      flexShrink: 0,
    }}>
      <Mark size={size * 0.62} color={accent} bg="transparent" />
    </div>
  );
}

// ─── LOGO SECTION ────────────────────────────────────────────────────────────
function LogoSection({ accent, logoVariant }) {
  const marks = [
    { id: 'crescent', label: 'Crescent', desc: 'Fase lunar — simples, reconhecível, funciona em 16px' },
    { id: 'eye',      label: 'Eye',      desc: 'Olho guardião com lua interna — mais narrativo' },
    { id: 'shield',   label: 'Shield',   desc: 'Escudo-guardião com crescent — confiança + proteção' },
  ];

  return (
    <section className="ds-section" id="logos">
      <div className="ds-section-label">01 — Logo System</div>
      <h2 className="ds-section-title">Identidade visual</h2>
      <p className="ds-section-sub">Três direções para o símbolo. Todas funcionam em 16px e como ícone de app. O wordmark usa DM Sans 800, lowercase, tracking −0.04em.</p>

      {/* MARK VARIATIONS */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24, marginBottom: 48 }}>
        {marks.map(m => {
          const Mark = m.id === 'eye' ? LogoEye : m.id === 'shield' ? LogoShield : LogoCrescent;
          const active = m.id === logoVariant;
          return (
            <div key={m.id} style={{
              background: active ? 'rgba(240,168,84,0.06)' : '#111',
              border: `1px solid ${active ? 'rgba(240,168,84,0.3)' : '#1C1C1E'}`,
              borderRadius: 20,
              padding: '36px 28px',
              transition: 'all 0.2s',
            }}>
              {/* Dark bg version */}
              <div style={{ display: 'flex', gap: 20, alignItems: 'center', marginBottom: 24 }}>
                <Mark size={64} color={accent} bg="transparent" />
                <Mark size={40} color={accent} bg="transparent" />
                <Mark size={24} color={accent} bg="transparent" />
                <Mark size={16} color={accent} bg="transparent" />
              </div>
              {/* Wordmark */}
              <div style={{ display: 'flex', gap: 16, alignItems: 'center', marginBottom: 20 }}>
                <Mark size={32} color={accent} bg="transparent" />
                <span style={{ fontFamily: 'DM Sans', fontWeight: 800, fontSize: 28, letterSpacing: '-0.04em' }}>nox</span>
              </div>
              {/* Light variant */}
              <div style={{
                background: '#F5F5F7', borderRadius: 12, padding: '16px 20px',
                display: 'flex', gap: 12, alignItems: 'center', marginBottom: 16,
              }}>
                <Mark size={28} color="#0A0A0A" bg="transparent" />
                <span style={{ fontFamily: 'DM Sans', fontWeight: 800, fontSize: 22, letterSpacing: '-0.04em', color: '#0A0A0A' }}>nox</span>
              </div>
              <div style={{ color: active ? accent : '#6C6C70', fontSize: 12, fontWeight: 500, marginBottom: 4 }}>
                {m.label} {active && '← selecionado'}
              </div>
              <div style={{ color: '#6C6C70', fontSize: 12 }}>{m.desc}</div>
            </div>
          );
        })}
      </div>

      {/* APP ICONS */}
      <div style={{ display: 'flex', gap: 20, alignItems: 'flex-end', flexWrap: 'wrap' }}>
        {[120, 80, 60, 44, 32, 20].map(sz => (
          <div key={sz} style={{ textAlign: 'center' }}>
            <AppIcon variant={logoVariant} size={sz} accent={accent} />
            <div style={{ color: '#6C6C70', fontSize: 11, marginTop: 8 }}>{sz}px</div>
          </div>
        ))}
        <div style={{ marginLeft: 'auto', background: '#F5F5F7', borderRadius: 20, padding: '16px 20px', display: 'flex', gap: 12, alignItems: 'center' }}>
          {[60, 44, 32].map(sz => (
            <div key={sz} style={{ textAlign: 'center' }}>
              <AppIcon variant={logoVariant} size={sz} accent="#0A0A0A" />
              <div style={{ color: '#A1A1A6', fontSize: 11, marginTop: 6 }}>{sz}px</div>
            </div>
          ))}
          <div style={{ marginLeft: 8 }}>
            <div style={{ fontFamily: 'DM Sans', fontWeight: 800, fontSize: 11, color: '#6C6C70', letterSpacing: '0.06em', textTransform: 'uppercase' }}>Light</div>
          </div>
        </div>
      </div>
    </section>
  );
}

// ─── COLOR TOKENS ─────────────────────────────────────────────────────────────
function ColorTokens({ accent }) {
  const tokens = [
    { name: 'bg-primary',     value: '#0A0A0A', label: 'Fundo principal' },
    { name: 'bg-secondary',   value: '#111111', label: 'Fundo secundário' },
    { name: 'bg-elevated',    value: '#1A1A1A', label: 'Cartões e modais' },
    { name: 'text-primary',   value: '#F5F5F7', label: 'Texto principal' },
    { name: 'text-secondary', value: '#A1A1A6', label: 'Texto de apoio' },
    { name: 'text-muted',     value: '#6C6C70', label: 'Placeholder / hint' },
    { name: 'accent',         value: accent,    label: 'Âmbar — CTA, links' },
    { name: 'accent-success', value: '#30D158', label: 'Receita / positivo' },
    { name: 'accent-danger',  value: '#FF453A', label: 'Despesa / negativo' },
    { name: 'border',         value: '#2C2C2E', label: 'Borda padrão' },
    { name: 'border-subtle',  value: '#1C1C1E', label: 'Divisórias suaves' },
  ];

  return (
    <section className="ds-section" id="tokens">
      <div className="ds-section-label">02 — Color Tokens</div>
      <h2 className="ds-section-title">Paleta & tokens</h2>
      <p className="ds-section-sub">Todos os tokens usados no sistema. O âmbar é o único acento — quente contra o preto absoluto, nunca frio.</p>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 12 }}>
        {tokens.map(t => {
          const isLight = ['#F5F5F7','#A1A1A6'].includes(t.value);
          return (
            <div key={t.name} style={{ background: '#111', border: '1px solid #1C1C1E', borderRadius: 16, overflow: 'hidden' }}>
              <div style={{
                height: 72,
                background: t.value,
                borderBottom: '1px solid #1C1C1E',
                position: 'relative',
              }}>
                {t.value === '#0A0A0A' && <div style={{ position: 'absolute', inset: 0, border: '1px solid #2C2C2E', borderRadius: 0 }} />}
              </div>
              <div style={{ padding: '12px 14px' }}>
                <div style={{ fontFamily: 'DM Sans', fontSize: 13, fontWeight: 700, marginBottom: 2 }}>{t.name}</div>
                <div style={{ color: '#6C6C70', fontSize: 12, marginBottom: 4 }}>{t.label}</div>
                <div style={{ color: accent, fontSize: 11, fontFamily: 'monospace' }}>{t.value}</div>
              </div>
            </div>
          );
        })}
      </div>
    </section>
  );
}

// ─── TYPOGRAPHY ───────────────────────────────────────────────────────────────
function Typography({ accent }) {
  return (
    <section className="ds-section" id="type">
      <div className="ds-section-label">03 — Tipografia</div>
      <h2 className="ds-section-title">Escala tipográfica</h2>
      <p className="ds-section-sub">DM Sans em toda a hierarquia — 800 para títulos, 300 para corpo. Contraste máximo de peso, família única.</p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
        {[
          { label: 'Display', font: 'DM Sans', weight: 800, size: 56, tracking: '-0.04em', text: 'Seu dinheiro. Sob controle.' },
          { label: 'H1', font: 'DM Sans', weight: 800, size: 40, tracking: '-0.03em', text: 'Finanças pessoais inteligentes' },
          { label: 'H2', font: 'DM Sans', weight: 700, size: 28, tracking: '-0.02em', text: 'Resumo do mês' },
          { label: 'H3', font: 'DM Sans', weight: 600, size: 20, tracking: '-0.01em', text: 'Despesas por categoria' },
          { label: 'Body', font: 'DM Sans', weight: 300, size: 16, tracking: '0', text: 'Conecte suas contas bancárias e veja tudo em um lugar. O Nox analisa seus gastos automaticamente.' },
          { label: 'Caption', font: 'DM Sans', weight: 400, size: 13, tracking: '0.01em', text: 'Última atualização: agora mesmo' },
          { label: 'Label', font: 'DM Sans', weight: 500, size: 12, tracking: '0.08em', text: 'RECEITA DO MÊS', upper: true },
        ].map((t, i) => (
          <div key={i} style={{
            padding: '24px 0',
            borderBottom: '1px solid #1C1C1E',
            display: 'flex',
            alignItems: 'baseline',
            gap: 32,
          }}>
            <div style={{ width: 64, flexShrink: 0 }}>
              <div style={{ color: accent, fontSize: 11, fontWeight: 500, letterSpacing: '0.08em', textTransform: 'uppercase' }}>{t.label}</div>
              <div style={{ color: '#6C6C70', fontSize: 11, marginTop: 2 }}>{t.font} {t.weight} / {t.size}px</div>
            </div>
            <div style={{
              fontFamily: t.font,
              fontWeight: t.weight,
              fontSize: t.size,
              letterSpacing: t.tracking,
              textTransform: t.upper ? 'uppercase' : 'none',
              color: '#F5F5F7',
              lineHeight: 1.2,
              flex: 1,
            }}>{t.text}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

// ─── LOGIN SCREENS ────────────────────────────────────────────────────────────
function LoginA({ accent }) {
  const [email, setEmail] = useState('');
  const [focused, setFocused] = useState(false);

  return (
    <div style={{
      background: '#0A0A0A',
      height: '100%',
      display: 'flex',
      flexDirection: 'column',
      padding: '0 28px',
      paddingBottom: 40,
    }}>
      {/* Status bar */}
      <div style={{ height: 52, display: 'flex', alignItems: 'center', justifyContent: 'space-between', paddingTop: 8 }}>
        <span style={{ fontSize: 15, fontWeight: 600, color: '#F5F5F7' }}>9:41</span>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <svg width="17" height="12" viewBox="0 0 17 12" fill="#F5F5F7"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="2" width="3" height="10" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12" fill="#F5F5F7"><path d="M7.5 2.5L13 7.5H2L7.5 2.5Z"/><circle cx="7.5" cy="9.5" r="1.5"/></svg>
          <div style={{ display: 'flex', gap: 1, alignItems: 'center' }}>
            <div style={{ width: 22, height: 11, border: '1.5px solid #F5F5F7', borderRadius: 3, position: 'relative', display: 'flex', alignItems: 'center', padding: '0 2px' }}>
              <div style={{ width: '80%', height: 6, background: '#F5F5F7', borderRadius: 1 }} />
              <div style={{ position: 'absolute', right: -4, width: 2.5, height: 5, background: '#F5F5F7', borderRadius: 1 }} />
            </div>
          </div>
        </div>
      </div>

      {/* App icon + brand */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', paddingTop: 20 }}>
        <div style={{ marginBottom: 32 }}>
          <AppIcon variant="crescent" size={72} accent={accent} />
        </div>
        <h1 style={{ fontFamily: 'DM Sans', fontWeight: 800, fontSize: 34, letterSpacing: '-0.03em', lineHeight: 1.05, marginBottom: 12, color: '#F5F5F7' }}>
          Qual é o seu<br />e-mail?
        </h1>
        <p style={{ color: '#6C6C70', fontSize: 15, fontWeight: 300, marginBottom: 40, lineHeight: 1.4 }}>
          O Nox cuida do seu dinheiro enquanto você dorme.

            { label: 'Freelance', cat: 'Renda extra', amount: '+R$ 800,00', color: '#30D158', icon: '↑', date: '12 abr' },
          ].map((t, i) => (
            <div key={i} style={{ padding: '16px 20px', borderBottom: i < 3 ? '1px solid #1C1C1E' : 'none', display: 'flex', alignItems: 'center', gap: 14 }}>
              <div style={{ width: 40, height: 40, borderRadius: 12, background: t.color + '18', display: 'flex', alignItems: 'center', justifyContent: 'center', color: t.color, fontSize: 16, fontWeight: 700, flexShrink: 0 }}>{t.icon}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 500, fontSize: 15 }}>{t.label}</div>
                <div style={{ color: '#6C6C70', fontSize: 12 }}>{t.cat} · {t.date}</div>
              </div>
              <div style={{ color: t.color, fontFamily: 'DM Sans', fontWeight: 700, fontSize: 15 }}>{t.amount}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Tags */}
      <div>
        <div style={{ color: '#6C6C70', fontSize: 12, fontWeight: 500, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 20 }}>Tags & badges</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {[
            { label: 'Alimentação', color: accent },
            { label: 'Moradia', color: '#30D158' },
            { label: 'Transporte', color: '#FF453A' },
            { label: 'Lazer', color: '#A1A1A6' },
            { label: 'Saúde', color: '#54C5F0' },
          ].map(tag => (
            <div key={tag.label} style={{ padding: '6px 14px', background: tag.color + '15', border: `1px solid ${tag.color}30`, borderRadius: 50, color: tag.color, fontSize: 13, fontWeight: 500 }}>{tag.label}</div>
          ))}
        </div>
      </div>
    </section>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const stored = (() => { try { return JSON.parse(localStorage.getItem('nox-ds-tweaks') || '{}'); } catch { return {}; } })();
  const defaults = { ...TWEAK_DEFAULTS, ...stored };

  const [accent, setAccent] = useState(defaults.accentColor);
  const [logoVariant, setLogoVariant] = useState(defaults.logoVariant);
  const [loginLayout, setLoginLayout] = useState(defaults.loginLayout);

  // Update CSS var
  useEffect(() => {
    document.documentElement.style.setProperty('--accent', accent);
    const save = { accentColor: accent, logoVariant, loginLayout };
    localStorage.setItem('nox-ds-tweaks', JSON.stringify(save));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: save }, '*');
  }, [accent, logoVariant, loginLayout]);

  // Tweaks panel wiring
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') {
        document.getElementById('tweaks-panel').classList.add('visible');
      } else if (e.data?.type === '__deactivate_edit_mode') {
        document.getElementById('tweaks-panel').classList.remove('visible');
      }
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    // Swatch clicks
    document.querySelectorAll('.tweaks-swatch').forEach(s => {
      s.addEventListener('click', () => {
        document.querySelectorAll('.tweaks-swatch').forEach(x => x.classList.remove('active'));
        s.classList.add('active');
        setAccent(s.dataset.color);
      });
    });

    document.getElementById('tweak-logo').addEventListener('change', e => setLogoVariant(e.target.value));
    document.getElementById('tweak-login').addEventListener('change', e => setLoginLayout(e.target.value));

    return () => window.removeEventListener('message', handler);
  }, []);

  return (
    <>
      {/* Hero banner */}
      <div className="ds-hero">
        <div className="ds-hero-text" style={{flex:1}}>
          <div className="ds-hero-badge">
            <svg width="14" height="14" viewBox="0 0 22 22"><path d="M14.5 4.2A7.8 7.8 0 1 0 14.5 19.8 7 7 0 0 1 14.5 4.2Z" fill="currentColor"/></svg>
            Brand Identity & Design System
          </div>
          <h1 style={{ display: 'block', fontFamily: 'DM Sans', fontWeight: 800, fontSize: 68, letterSpacing: '-0.04em', lineHeight: 0.95, marginBottom: 16 }}>
            <span style={{ color: 'var(--accent)' }}>nox</span><br />
            design system
          </h1>
          <p style={{ color: 'var(--text-secondary)', fontSize: 17, fontWeight: 300, maxWidth: 400, lineHeight: 1.5 }}>
            Identidade visual, tokens, componentes e telas para o app de finanças pessoais com IA.
          </p>
        </div>
        <div style={{ display: 'flex', gap: 20, flexShrink: 0 }}>
          <AppIcon variant={logoVariant} size={120} accent={accent} elevated />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            <AppIcon variant={logoVariant} size={60} accent={accent} elevated />
            <AppIcon variant={logoVariant} size={44} accent={accent} elevated />
            <AppIcon variant={logoVariant} size={32} accent={accent} elevated />
          </div>
        </div>
      </div>

      <LogoSection accent={accent} logoVariant={logoVariant} />
      <ColorTokens accent={accent} />
      <Typography accent={accent} />
      <LoginSection accent={accent} loginLayout={loginLayout} />
      <HeroSection accent={accent} logoVariant={logoVariant} />
      <ComponentsSection accent={accent} />

      {/* Footer */}
      <div style={{ maxWidth: 1200, margin: '0 auto', padding: '40px 40px 80px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <LogoCrescent size={18} color={accent} bg="transparent" />
          <span style={{ fontFamily: 'DM Sans', fontWeight: 800, fontSize: 16, letterSpacing: '-0.03em' }}>nox</span>
          <span style={{ color: '#6C6C70', fontSize: 13 }}>/ Design System v1.0</span>
        </div>
        <div style={{ color: '#6C6C70', fontSize: 12 }}>DM Sans 800/300 · True Black #0A0A0A · Âmbar {accent}</div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
